<nav class="navbar navbar-expand-md barra">
  <div class="container">
    <a class="navbar-brand marca" routerLink="/publicaciones">
      <img src="favicon.svg" alt="" width="30" height="30" class="me-2" />Conecta
    </a>
    <button class="navbar-toggler" type="button" aria-label="Abrir menú" (click)="menuAbierto = !menuAbierto">
      <i class="bi bi-list text-white fs-2"></i>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAbierto">
      <ul class="navbar-nav me-auto mt-2 mt-md-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/publicaciones" routerLinkActive="activo" (click)="menuAbierto = false">
            <i class="bi bi-chat-square-text me-1"></i>Publicaciones
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/mi-perfil" routerLinkActive="activo" (click)="menuAbierto = false">
            <i class="bi bi-person-circle me-1"></i>Mi perfil
          </a>
        </li>
      </ul>

      <ul class="navbar-nav align-items-md-center gap-md-2">
        @if (auth.logueado()) {
          <li class="nav-item saludo">Hola, {{ auth.usuario()?.nombre }}</li>
          <li class="nav-item">
            <button class="btn btn-sm btn-light" type="button" (click)="salir()">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="activo" (click)="menuAbierto = false">Ingresar</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-light" routerLink="/registro" (click)="menuAbierto = false">Registrarse</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
